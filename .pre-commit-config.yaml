repos:
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v8.3.0
    hooks:
      - id: complexipy
        args: [--max-complexity-allowed, "15", --failed]
        files: ^(src/|build_tools/)
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked python -m ruff format
        language: system
        types: [python]
        files: ^(src/|build_tools/|tests/)
      - id: ruff-check
        name: ruff check
        entry: uv run --locked python -m ruff check
        language: system
        types: [python]
        files: ^(src/|build_tools/|tests/)
      - id: mypy
        name: mypy
        entry: uv run --locked python -m mypy src build_tools
        language: system
        pass_filenames: false
      - id: slop
        name: slop lint
        entry: uv run --locked slop lint --output human
        language: system
        pass_filenames: false
        always_run: true
      - id: api-stubs
        name: check generated API stubs
        entry: uv run --locked python build_tools/generate_api_stubs.py --check
        language: system
        pass_filenames: false
        files: ^(src/|build_tools/)
      - id: arch-lint
        name: architecture layer lint
        entry: uv run --locked python build_tools/lint/arch_lint.py
        language: system
        pass_filenames: false
        files: ^(src/)
      - id: comment-lint
        name: forbid comments
        entry: uv run --locked python build_tools/lint/comment_lint.py
        language: system
        pass_filenames: false
        files: ^(src/)
      - id: gpu-lifecycle-lint
        name: GPU lifecycle lint
        entry: uv run --locked python build_tools/lint/gpu_lifecycle.py
        language: system
        pass_filenames: false
        files: ^(src/)
      - id: shader-layout-lint
        name: shader layout lint
        entry: uv run --locked python build_tools/lint/shader_layout.py
        language: system
        pass_filenames: false
        files: ^(src/)
      - id: shader-contract-inventory
        name: shader contract inventory lint
        entry: uv run --locked python build_tools/lint/shader_contract_inventory.py
        language: system
        pass_filenames: false
        files: ^src/sdf_ui/gpu/nodes/
      - id: shader-rule-coverage
        name: shader rule coverage lint
        entry: uv run --locked python build_tools/lint/shader_rule_coverage.py
        language: system
        pass_filenames: false
        files: ^(src/sdf_ui/gpu/nodes/|src/sdf_ui/learning/shaders/)
      - id: shader-lowering-coverage
        name: shader lowering coverage lint
        entry: uv run --locked python build_tools/lint/shader_lowering_coverage.py
        language: system
        pass_filenames: false
        files: ^(src/sdf_ui/gpu/nodes/|src/sdf_ui/graph/lowering\.py$)
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
