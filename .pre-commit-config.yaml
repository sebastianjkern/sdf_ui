repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked python -m ruff format
        language: system
        types: [python]
        files: ^(src/|build_tools/|tests/)
      - id: ruff-check
        name: ruff check
        entry: uv run --locked python -m ruff check
        language: system
        types: [python]
        files: ^(src/|build_tools/|tests/)
      - id: mypy
        name: mypy
        entry: uv run --locked python -m mypy src build_tools
        language: system
        pass_filenames: false
      - id: api-stubs
        name: check generated API stubs
        entry: uv run --locked python build_tools/generate_api_stubs.py --check
        language: system
        pass_filenames: false
        files: ^(src/|build_tools/)
